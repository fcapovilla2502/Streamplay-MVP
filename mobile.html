<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STREAMPLAY - Jugador</title>
  <style>
    :root {
      --bg-color: #05050A;
      --primary: #FF00FF;
      --secondary: #00FFFF;
      --text: #FFFFFF;
      --glass-bg: rgba(20, 20, 30, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      /* Simulación de pantalla móvil (9:16) si se abre en desktop */
      max-width: 400px; 
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at top, #1a0b2e 0%, var(--bg-color) 100%);
      border-left: 1px solid #222;
      border-right: 1px solid #222;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      justify-content: center;
    }

    /* ESTILOS DEL LOBBY (ESPERA) */
    .avatar-glow {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #333;
      margin: 0 auto 20px;
      border: 2px solid var(--primary);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
    }

    .player-card {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      margin: 40px 0;
      text-align: left;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    
    .progress-fill {
      width: 48%;
      height: 100%;
      background: var(--secondary);
      box-shadow: 0 0 10px var(--secondary);
    }

    .btn-massive {
      background: rgba(255, 0, 255, 0.1);
      color: var(--text);
      border: 1px solid var(--primary);
      padding: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      width: 100%;
      margin-top: auto;
      text-transform: uppercase;
      box-shadow: inset 0 0 20px rgba(255,0,255,0.1);
    }

    /* ESTILOS DEL JUEGO (GAMEPLAY) */
    .timer-header {
      width: 100%;
      height: 4px;
      background: var(--secondary);
      position: absolute;
      top: 0; left: 0;
      box-shadow: 0 0 15px var(--secondary);
      transition: width 1s linear;
    }

    .question-title {
      font-size: 1.5rem;
      margin-bottom: 40px;
      text-align: center;
      line-height: 1.4;
    }

    .answers-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-answer {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 24px 20px;
      font-size: 1.2rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      transition: all 0.2s;
    }

    .btn-answer .letter {
      color: var(--secondary);
      font-weight: bold;
      margin-right: 15px;
      font-size: 1.4rem;
    }

    /* Estado cuando el usuario presiona una respuesta */
    .btn-answer.selected {
      background: rgba(255, 0, 255, 0.15);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(255,0,255,0.4);
      transform: scale(0.98);
    }

    .btn-answer.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="timer-header" id="mobile-timer" style="display: none;"></div>

  <!-- PANTALLA 1: LOBBY -->
  <div id="mobile-waiting" class="screen">
    <div style="text-align: center;">
      <div class="avatar-glow"></div>
      <h2 style="color: var(--text); letter-spacing: 2px;">TRIVIA DEL GORDO</h2>
      <p style="color: #888; margin-top: 10px;">Preparando partida...</p>
    </div>

    <div class="player-card">
      <p style="color: #aaa; font-size: 0.8rem; margin-bottom: 5px;">👤 JUGADOR</p>
      <h3 style="font-size: 1.4rem; margin-bottom: 15px;">FERNANDO</h3>
      <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
        <span>NIVEL 18</span>
        <span style="color: var(--secondary)">XP 4.820</span>
      </div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>

    <button class="btn-massive" onclick="joinGame()">ENTRAR A LA PARTIDA</button>
  </div>

  <!-- PANTALLA 2: GAMEPLAY -->
  <div id="mobile-question" class="screen" style="display: none;">
    <p style="color: var(--primary); font-weight: bold; text-align: center; margin-bottom: 15px;">PREGUNTA 04 / 20</p>
    <h1 class="question-title">¿Cuál fue la primera consola de Sony?</h1>

    <div class="answers-grid">
      <button class="btn-answer" onclick="selectAnswer(this)">
        <span class="letter">A</span> PLAYSTATION
      </button>
      <button class="btn-answer" onclick="selectAnswer(this)">
        <span class="letter">B</span> NINTENDO 64
      </button>
      <button class="btn-answer" onclick="selectAnswer(this)">
        <span class="letter">C</span> SEGA SATURN
      </button>
      <button class="btn-answer" onclick="selectAnswer(this)">
        <span class="letter">D</span> DREAMCAST
      </button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHU_KHVA5JezYLPed6Yg93fwCXUSa4qVc",
      authDomain: "streamplay-mvp.firebaseapp.com",
      databaseURL: "https://streamplay-mvp-default-rtdb.firebaseio.com",
      projectId: "streamplay-mvp",
      storageBucket: "streamplay-mvp.firebasestorage.app",
      messagingSenderId: "254252838564",
      appId: "1:254252838564:web:2100d6b3a40d7ac7ce0031"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. Botón de ingreso del espectador
    function joinGame() {
      const btn = document.querySelector('.btn-massive');
      btn.innerText = "ESPERANDO AL STREAMER...";
      btn.style.opacity = "0.5";
      btn.style.pointerEvents = "none";
      // Aquí a futuro enviaríamos el nombre del jugador a la base de datos
    }

    // 2. Escuchar las órdenes del Dashboard
    db.ref("salas/room_1").on("value", (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      // Si el streamer inicia la pregunta
      if (data.status === "question_active") {
        document.getElementById('mobile-waiting').style.display = 'none';
        document.getElementById('mobile-question').style.display = 'flex';
        document.getElementById('mobile-timer').style.display = 'block';
        
        // Reiniciar los botones por si es una pregunta nueva
        const allButtons = document.querySelectorAll('.btn-answer');
        allButtons.forEach(btn => {
          btn.classList.remove('selected', 'disabled');
          btn.style.pointerEvents = 'auto'; 
        });
      } 
      // Si el streamer vuelve a la sala de espera
      else if (data.status === "waiting_players") {
        document.getElementById('mobile-waiting').style.display = 'flex';
        document.getElementById('mobile-question').style.display = 'none';
        document.getElementById('mobile-timer').style.display = 'none';
        
        const btn = document.querySelector('.btn-massive');
        btn.innerText = "ENTRAR A LA PARTIDA";
        btn.style.opacity = "1";
        btn.style.pointerEvents = "auto";
      }
    });

    // 3. Lógica visual al tocar una respuesta
    function selectAnswer(buttonElement) {
      buttonElement.classList.add('selected');
      
      const allButtons = document.querySelectorAll('.btn-answer');
      allButtons.forEach(btn => {
        if (btn !== buttonElement) {
          btn.classList.add('disabled');
        }
        btn.style.pointerEvents = 'none'; 
      });
      
      console.log("Respuesta seleccionada lista para enviar");
    }
  </script>
</body>
</html>
