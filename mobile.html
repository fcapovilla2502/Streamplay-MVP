<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STREAMPLAY - Jugador</title>
  <style>
    :root {
      --bg-color: #05050A;
      --primary: #FF00FF;
      --secondary: #00FFFF;
      --text: #FFFFFF;
      --glass-bg: rgba(20, 20, 30, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      max-width: 400px; 
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at top, #1a0b2e 0%, var(--bg-color) 100%);
      border-left: 1px solid #222;
      border-right: 1px solid #222;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      justify-content: center;
    }

    /* ESTILOS DEL LOBBY (ESPERA) */
    .avatar-glow {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #333;
      margin: 0 auto 20px;
      border: 2px solid var(--primary);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
    }

    .player-card {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      margin: 40px 0;
      text-align: left;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    
    .progress-fill {
      width: 48%;
      height: 100%;
      background: var(--secondary);
      box-shadow: 0 0 10px var(--secondary);
    }

    .btn-massive {
      background: rgba(255, 0, 255, 0.1);
      color: var(--text);
      border: 1px solid var(--primary);
      padding: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      width: 100%;
      margin-top: auto;
      text-transform: uppercase;
      box-shadow: inset 0 0 20px rgba(255,0,255,0.1);
      cursor: pointer;
    }

    /* ESTILOS DEL JUEGO (GAMEPLAY) */
    .timer-header {
      width: 100%;
      height: 4px;
      background: var(--secondary);
      position: absolute;
      top: 0; left: 0;
      box-shadow: 0 0 15px var(--secondary);
      transition: width 1s linear;
    }

    .question-title {
      font-size: 1.5rem;
      margin-bottom: 40px;
      text-align: center;
      line-height: 1.4;
    }

    .answers-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-answer {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 24px 20px;
      font-size: 1.2rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-answer .letter {
      color: var(--secondary);
      font-weight: bold;
      margin-right: 15px;
      font-size: 1.4rem;
    }

    .btn-answer.selected {
      background: rgba(255, 0, 255, 0.15);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(255,0,255,0.4);
      transform: scale(0.98);
    }

    .btn-answer.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="timer-header" id="mobile-timer" style="display: none;"></div>

  <!-- PANTALLA 1: LOBBY -->
  <div id="mobile-waiting" class="screen">
    <div style="text-align: center;">
      <div class="avatar-glow" id="ui-avatar"></div>
      <h2 style="color: var(--text); letter-spacing: 2px;">TRIVIA DEL GORDO</h2>
      <p style="color: #888; margin-top: 10px;">Preparando partida...</p>
    </div>

    <div class="player-card">
      <p style="color: #aaa; font-size: 0.8rem; margin-bottom: 5px;">👤 JUGADOR</p>
      <h3 id="ui-player-name" style="font-size: 1.4rem; margin-bottom: 15px;">INVITADO</h3>
      <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
        <span>NIVEL 1</span>
        <span style="color: var(--secondary)">XP 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width: 0%;"></div></div>
    </div>

    <button id="btn-login" class="btn-massive" style="background: #ffffff; color: #000; border-color: #fff;" onclick="loginWithGoogle()">
      <span style="font-size: 1.2rem; font-weight: bold;">🔑 ENTRAR CON GOOGLE</span>
    </button>
  </div>

  <!-- PANTALLA 2: GAMEPLAY -->
  <div id="mobile-question" class="screen" style="display: none;">
    <p style="color: var(--primary); font-weight: bold; text-align: center; margin-bottom: 15px;">¡PREGUNTA EN CURSO!</p>
    <h1 class="question-title">Cargando...</h1>

    <div class="answers-grid">
      <!-- Las opciones se inyectan dinámicamente aquí -->
    </div>
  </div>

  <!-- SCRIPTS DE FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHU_KHVA5JezYLPed6Yg93fwCXUSa4qVc",
      authDomain: "streamplay-mvp.firebaseapp.com",
      databaseURL: "https://streamplay-mvp-default-rtdb.firebaseio.com",
      projectId: "streamplay-mvp",
      storageBucket: "streamplay-mvp.firebasestorage.app",
      messagingSenderId: "254252838564",
      appId: "1:254252838564:web:2100d6b3a40d7ac7ce0031"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const provider = new firebase.auth.GoogleAuthProvider();

    let myPlayerId = "";
    let myPlayerName = "";

    // 1. AUTO-LOGIN: Firebase recuerda si ya entraste antes
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        myPlayerName = user.displayName; 
        myPlayerId = user.uid; 
        
        document.getElementById('ui-player-name').innerText = myPlayerName.toUpperCase();
        document.getElementById('ui-avatar').style.background = `url(${user.photoURL}) center/cover no-repeat`;

        const btn = document.getElementById('btn-login');
        btn.innerHTML = "ESPERANDO AL STREAMER...";
        btn.style.background = "rgba(255, 0, 255, 0.1)";
        btn.style.color = "var(--text)";
        btn.style.borderColor = "var(--primary)";
        btn.style.opacity = "0.5";
        btn.style.pointerEvents = "none";
      }
    });

    // 2. INGRESO MANUAL CON GOOGLE
    function loginWithGoogle() {
      firebase.auth().signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          myPlayerName = user.displayName; 
          myPlayerId = user.uid; 
          
          document.getElementById('ui-player-name').innerText = myPlayerName.toUpperCase();
          document.getElementById('ui-avatar').style.background = `url(${user.photoURL}) center/cover no-repeat`;

          const btn = document.getElementById('btn-login');
          btn.innerHTML = "ESPERANDO AL STREAMER...";
          btn.style.background = "rgba(255, 0, 255, 0.1)";
          btn.style.color = "var(--text)";
          btn.style.borderColor = "var(--primary)";
          btn.style.opacity = "0.5";
          btn.style.pointerEvents = "none";

          db.ref("salas/room_1/players/" + myPlayerId).set({
            name: myPlayerName,
            score: 0,
            current_answer: "",
            photo: user.photoURL 
          });
        })
        .catch((error) => {
          console.error("Error al iniciar sesión:", error);
          alert("Hubo un error al conectar con Google.");
        });
    }

    // 3. ESCUCHAR LAS ÓRDENES DEL DASHBOARD
    db.ref("salas/room_1").on("value", (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (data.status === "question_active") {
        document.getElementById('mobile-waiting').style.display = 'none';
        document.getElementById('mobile-question').style.display = 'flex';
        document.getElementById('mobile-timer').style.display = 'block';
        
        const qData = data.current_state.question_data;
        const currentDisplayedQuestion = document.querySelector('.question-title').innerText;

        // Protección contra el bucle de borrado visual
        if (currentDisplayedQuestion !== qData.text) {
          document.querySelector('.question-title').innerText = qData.text;
          
          const grid = document.querySelector('.answers-grid');
          grid.innerHTML = ""; 
          qData.options.forEach(opt => {
            grid.innerHTML += `
              <button class="btn-answer" onclick="selectAnswer(this)">
                <span class="letter">${opt.id}</span> ${opt.text}
              </button>
            `;
          });

          // Limpiar la respuesta en la base de datos al arrancar nueva pregunta
          if (myPlayerId !== "") {
            db.ref("salas/room_1/players/" + myPlayerId).update({
              current_answer: ""
            });
          }
        }
      } 
      else if (data.status === "time_up") {
        const correctId = data.current_state.question_data.correct_answer_id;
        const allButtons = document.querySelectorAll('.btn-answer');
        
        allButtons.forEach(btn => {
          btn.style.pointerEvents = 'none'; 
          const letter = btn.querySelector('.letter').innerText.trim(); 
          
          if (letter === correctId) {
            btn.style.background = "rgba(0, 255, 0, 0.15)";
            btn.style.borderColor = "#00FF00";
            btn.style.opacity = "1";
          } else if (btn.classList.contains('selected')) {
            btn.style.background = "rgba(255, 0, 0, 0.15)";
            btn.style.borderColor = "#FF0000";
            btn.style.opacity = "1";
          } else {
            btn.classList.add('disabled');
          }
        });
      }
      else if (data.status === "waiting_players") {
        document.getElementById('mobile-waiting').style.display = 'flex';
        document.getElementById('mobile-question').style.display = 'none';
        document.getElementById('mobile-timer').style.display = 'none';
        
        const btn = document.getElementById('btn-login');
        if (myPlayerId === "") {
          btn.innerHTML = "<span style='font-size: 1.2rem; font-weight: bold;'>🔑 ENTRAR CON GOOGLE</span>";
          btn.style.background = "#ffffff";
          btn.style.color = "#000";
          btn.style.borderColor = "#fff";
          btn.style.opacity = "1";
          btn.style.pointerEvents = "auto";
        }
      }
    });

    // 4. ENVIAR LA RESPUESTA SELECCIONADA A FIREBASE
    function selectAnswer(buttonElement) {
      buttonElement.classList.add('selected');
      
      const allButtons = document.querySelectorAll('.btn-answer');
      allButtons.forEach(btn => {
        if (btn !== buttonElement) {
          btn.classList.add('disabled');
        }
        btn.style.pointerEvents = 'none'; 
      });
      
      const selectedLetter = buttonElement.querySelector('.letter').innerText.trim();
      
      if (myPlayerId !== "") {
        db.ref("salas/room_1/players/" + myPlayerId).update({
          current_answer: selectedLetter
        });
      }
    }
  </script>
</body>
</html>
